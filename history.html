<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6b4a2b">
  <title>CamelTracker — Historique</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="hist">

  <header>
    <a href="index.html" class="back" title="Retour à la carte">←</a>
    <h1>Historique</h1>
    <div class="status">
      <span id="statusText">…</span>
    </div>
  </header>

  <!-- Barre de contrôle -->
  <div class="hist-controls">
    <div class="row1">
      <select id="device" aria-label="Chameau"></select>
      <button id="showBtn" class="primary">Afficher</button>
    </div>
    <div class="row2">
      <label>Du <input id="from" type="datetime-local"></label>
      <label>Au <input id="to" type="datetime-local"></label>
    </div>
    <div class="row3">
      <button data-range="today" class="chip">Aujourd'hui</button>
      <button data-range="24h" class="chip">24 h</button>
      <button data-range="7j" class="chip">7 jours</button>
    </div>
  </div>

  <!-- Carte -->
  <div id="map"></div>

  <!-- Barre de lecture (playback) -->
  <div class="playbar">
    <button id="playBtn" class="play">▶</button>
    <input id="scrub" type="range" min="0" max="0" value="0">
    <select id="speedSel" class="speed" aria-label="Vitesse de lecture">
      <option value="4">x4</option>
      <option value="8" selected>x8</option>
      <option value="16">x16</option>
      <option value="32">x32</option>
    </select>
    <span id="playTime" class="time">—</span>
  </div>

  <!-- Panneau des arrêts -->
  <div id="panel" class="hist-panel">
    <div class="handle" id="panelHandle">🛑 Arrêts détectés</div>
    <div id="stops" class="list"></div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
