<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6b4a2b">
  <title>CamelTracker — Zones</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="gf">

  <header>
    <a href="index.html" class="back" title="Retour à la carte">←</a>
    <h1>Zones par chameau</h1>
    <div class="status"><span id="statusText"></span></div>
  </header>

  <div id="map"></div>

  <!-- Éditeur de zone (par chameau) -->
  <div class="gf-editor">
    <div class="gf-field">
      <label for="device">Chameau</label>
      <select id="device"></select>
    </div>

    <div id="gfStatus" class="gf-status none">—</div>

    <div class="gf-field">
      <label>Rayon autorisé autour du campement</label>
      <div class="gf-radius-row">
        <input id="radius" type="range" min="1" max="150" step="1" value="30">
        <span class="gf-radius-val"><span id="radiusVal">30</span> km</span>
      </div>
      <div class="gf-presets">
        <button class="chip" data-km="15">15 km</button>
        <button class="chip" data-km="30">30 km</button>
        <button class="chip" data-km="50">50 km</button>
        <button class="chip" data-km="100">100 km</button>
      </div>
    </div>

    <p class="hint">🏕️ Glisse le marqueur du campement sur la carte pour déplacer le centre de la zone.</p>

    <div class="gf-toggle">
      <span class="lab">Alertes de sortie activées</span>
      <label class="switch">
        <input id="enabled" type="checkbox" checked>
        <span class="track"></span>
      </label>
    </div>

    <div class="gf-actions">
      <button class="center-btn" id="centerBtn">Centrer sur la position actuelle</button>
      <button class="save-btn" id="saveBtn">Enregistrer</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/geofence.js"></script>
  <script src="js/map.js"></script>
  <script src="js/geofence-ui.js"></script>
</body>
</html>
