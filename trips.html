<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6b4a2b">
  <title>CamelTracker — Déplacements</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="trips">

  <header>
    <a href="index.html" class="back" id="headerBack" title="Retour">←</a>
    <h1 id="pageTitle">Déplacements</h1>
    <div class="status"><span id="statusText"></span></div>
  </header>

  <!-- ===== VUE CARTE ===== -->
  <div id="map"></div>

  <div class="chip-bar" id="tripBar">
    <button class="chip add" id="addTripBtn" type="button">➕ Déplacement</button>
  </div>

  <div class="sel-bar" id="selBar" hidden>
    <div class="sel-info">
      <div class="sel-name" id="selName"></div>
      <div class="sel-sub" id="selSub"></div>
    </div>
    <button class="chip start" id="startStopBtn" type="button">▶ Démarrer</button>
    <button class="chip" id="editSelBtn" type="button">✏️</button>
    <button class="chip danger" id="delSelBtn" type="button">🗑️</button>
  </div>

  <!-- ===== VUE FORMULAIRE (création / édition) ===== -->
  <section id="editView" class="form-page" hidden>
    <div class="form-card">
      <div class="form-title" id="formTitle">Nouveau déplacement</div>
      <div class="form-field">
        <label>Nom du déplacement</label>
        <input id="tripName" type="text" placeholder="ex. Vers le puits d'Aïoun" autocomplete="off">
      </div>

      <div class="form-field">
        <label>🧑🏽 GPS du berger <span class="lbl-note">— le tracker qu'il porte</span></label>
        <div id="guideChips" class="pick-chips"></div>
      </div>

      <div class="form-field">
        <label>🐫 Chameaux du déplacement</label>
        <div id="memberChips" class="pick-chips"></div>
      </div>

      <div class="form-field">
        <label>📏 Distance max au berger</label>
        <div class="gf-radius-row">
          <input id="threshold" type="range" min="1" max="20" step="1" value="3">
          <span class="gf-radius-val"><span id="thresholdVal">3</span> km</span>
        </div>
      </div>

      <div id="tripStatus" class="gf-status none">—</div>

      <div class="edit-actions">
        <button class="ghost-btn" id="cancelBtn" type="button">Annuler</button>
        <button class="primary grow" id="saveBtn" type="button">Enregistrer</button>
      </div>
    </div>
  </section>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/geofence.js"></script>
  <script src="js/trips.js"></script>
  <script src="js/camels.js"></script>
  <script src="js/map.js"></script>
  <script src="js/trips-ui.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
