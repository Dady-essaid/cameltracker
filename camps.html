<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6b4a2b">
  <title>CamelTracker — Camps</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="camps">

  <header>
    <a href="index.html" class="back" title="Retour à la carte">←</a>
    <h1 id="pageTitle">Camps</h1>
    <div class="status"><span id="statusText"></span></div>
  </header>

  <div id="map"></div>

  <!-- Barre des camps (boutons) + ajout -->
  <div class="chip-bar" id="campBar">
    <button class="chip add" id="addCampBtn" type="button">➕ Camp</button>
  </div>

  <!-- Info du camp sélectionné -->
  <div class="sel-bar" id="selBar" hidden>
    <div class="sel-info">
      <div class="sel-name" id="selName"></div>
      <div class="sel-sub" id="selSub"></div>
    </div>
    <button class="chip" id="editSelBtn" type="button">✏️</button>
    <button class="chip danger" id="delSelBtn" type="button">🗑️</button>
  </div>

  <!-- Éditeur de camp : carte compacte flottante -->
  <div class="camp-editor" id="editSheet" hidden>
    <div class="ce-head">
      <input id="campName" type="text" placeholder="Nom du camp" autocomplete="off">
      <div class="seg2" id="typeTabs">
        <button class="tab active" data-type="circle" type="button">⭕</button>
        <button class="tab" data-type="polygon" type="button">✏️</button>
      </div>
    </div>

    <div id="circleCtrls" class="ce-row">
      <label class="ce-rlab" for="radius">Rayon</label>
      <input id="radius" class="ce-num" type="number" min="1" max="2000" step="1" value="30" inputmode="numeric">
      <span class="ce-unit">km</span>
    </div>

    <div id="polyCtrls" class="ce-row" hidden>
      <button id="undoBtn" class="mini-chip" type="button">↩︎ Annuler</button>
      <button id="clearBtn" class="mini-chip" type="button">🗑️</button>
      <span id="polyCount" class="poly-count">0 point</span>
    </div>

    <div class="ce-members">
      <span class="ce-lab">🐫</span>
      <div id="members" class="pick-chips"></div>
    </div>

    <p class="ce-hint" id="editHint">Touchez la carte pour poser le camp 🏕️</p>
    <div id="gfStatus" class="ce-status none">—</div>

    <div class="ce-actions">
      <button class="ghost-btn" id="cancelBtn" type="button">Annuler</button>
      <button class="primary grow" id="saveBtn" type="button">Enregistrer</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/geofence.js"></script>
  <script src="js/camps.js"></script>
  <script src="js/map.js"></script>
  <script src="js/camps-ui.js"></script>
</body>
</html>
