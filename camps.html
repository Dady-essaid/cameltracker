<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6b4a2b">
  <title>CamelTracker — Camps</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="camps">

  <header>
    <a href="index.html" class="back" id="headerBack" title="Retour">←</a>
    <h1 id="pageTitle">Camps</h1>
    <div class="status"><span id="statusText"></span></div>
  </header>

  <!-- ===== VUE LISTE ===== -->
  <section id="listView" class="camps-list">
    <div id="campCards" class="camp-cards"></div>
    <button id="createCampBtn" class="wide-btn">➕ Créer un camp</button>
  </section>

  <!-- ===== VUE ÉDITION ===== -->
  <section id="editView" hidden>
    <div id="map"></div>

    <!-- Barre flottante du mode dessin (forme libre) -->
    <div id="drawBar" class="draw-bar" hidden>
      <span id="drawCount" class="draw-count">0 point</span>
      <button id="drawUndo" class="chip" type="button">↩︎ Annuler</button>
      <button id="drawClear" class="chip" type="button">🗑️ Effacer</button>
      <button id="drawDone" class="primary" type="button">✓ Terminer</button>
    </div>

    <!-- Panneau d'édition (feuille basse, compacte) -->
    <div class="edit-sheet" id="editSheet">
      <input id="campName" type="text" placeholder="Nom du camp (ex. Campement Nord)" autocomplete="off">

      <div id="gfStatus" class="gf-status none">—</div>

      <!-- Onglets de MODE -->
      <div class="tabs" id="modeTabs">
        <button class="tab active" data-mode="camp" type="button">🏕️ Au campement</button>
        <button class="tab" data-mode="move" type="button">🧭 En déplacement</button>
      </div>

      <!-- Onglet : Au campement -->
      <div id="campPane">
        <div class="tabs sub" id="typeTabs">
          <button class="tab active" data-type="circle" type="button">⭕ Cercle</button>
          <button class="tab" data-type="polygon" type="button">✏️ Forme libre</button>
        </div>

        <div id="circleCtrls">
          <div class="gf-radius-row">
            <input id="radius" type="range" min="1" max="150" step="1" value="30">
            <span class="gf-radius-val"><span id="radiusVal">30</span> km</span>
          </div>
          <div class="gf-presets">
            <button class="chip" data-km="15" type="button">15 km</button>
            <button class="chip" data-km="30" type="button">30 km</button>
            <button class="chip" data-km="50" type="button">50 km</button>
            <button class="chip" data-km="100" type="button">100 km</button>
          </div>
          <button class="chip center-chip" id="centerBtn" type="button">📍 Centrer sur le troupeau</button>
        </div>

        <div id="polyCtrls" hidden>
          <p class="hint">Dessine la zone directement sur la carte, au doigt.</p>
          <button id="drawStart" class="wide-btn light" type="button">✏️ Dessiner la zone sur la carte</button>
        </div>
      </div>

      <!-- Onglet : En déplacement -->
      <div id="movePane" hidden>
        <p class="hint">La zone fixe est ignorée. Alerte si un chameau s'éloigne du <b>groupe</b> au-delà du seuil.</p>
        <div class="gf-radius-row">
          <input id="cohesion" type="range" min="1" max="20" step="1" value="3">
          <span class="gf-radius-val"><span id="cohesionVal">3</span> km</span>
        </div>
      </div>

      <!-- Chameaux affectés -->
      <div class="edit-field">
        <label>Chameaux de ce camp</label>
        <div id="members" class="members"></div>
      </div>

      <div class="edit-actions">
        <button class="ghost-btn danger" id="deleteBtn" type="button">🗑️</button>
        <button class="ghost-btn" id="cancelBtn" type="button">Annuler</button>
        <button class="primary grow" id="saveBtn" type="button">Enregistrer</button>
      </div>
    </div>
  </section>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/geofence.js"></script>
  <script src="js/camps.js"></script>
  <script src="js/map.js"></script>
  <script src="js/camps-ui.js"></script>
</body>
</html>
