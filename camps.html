<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6b4a2b">
  <title>CamelTracker — Camps</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="camps">

  <header>
    <a href="index.html" class="back" title="Retour à la carte">←</a>
    <h1 id="pageTitle">Camps</h1>
    <div class="status"><span id="statusText"></span></div>
  </header>

  <div id="map"></div>

  <!-- Barre des camps (boutons) + ajout -->
  <div class="chip-bar" id="campBar">
    <button class="chip add" id="addCampBtn" type="button">➕ Camp</button>
  </div>

  <!-- Info du camp sélectionné -->
  <div class="sel-bar" id="selBar" hidden>
    <div class="sel-info">
      <div class="sel-name" id="selName"></div>
      <div class="sel-sub" id="selSub"></div>
    </div>
    <button class="chip" id="editSelBtn" type="button">✏️</button>
    <button class="chip danger" id="delSelBtn" type="button">🗑️</button>
  </div>

  <!-- Feuille d'ajout / édition -->
  <div class="edit-sheet" id="editSheet" hidden>
    <input id="campName" type="text" placeholder="Nom du camp (ex. Campement Nord)" autocomplete="off">
    <div id="gfStatus" class="gf-status none">—</div>

    <div class="tabs sub" id="typeTabs">
      <button class="tab active" data-type="circle" type="button">⭕ Cercle</button>
      <button class="tab" data-type="polygon" type="button">✏️ Forme libre</button>
    </div>

    <p class="hint" id="editHint">Touchez la carte pour poser le campement 🏕️</p>

    <div id="circleCtrls">
      <div class="gf-radius-row">
        <input id="radius" type="range" min="1" max="150" step="1" value="30">
        <span class="gf-radius-val"><span id="radiusVal">30</span> km</span>
      </div>
      <div class="gf-presets">
        <button class="chip" data-km="15" type="button">15 km</button>
        <button class="chip" data-km="30" type="button">30 km</button>
        <button class="chip" data-km="50" type="button">50 km</button>
        <button class="chip" data-km="100" type="button">100 km</button>
      </div>
    </div>

    <div id="polyCtrls" hidden>
      <div class="gf-poly-actions">
        <button id="undoBtn" class="chip" type="button">↩︎ Annuler</button>
        <button id="clearBtn" class="chip" type="button">🗑️ Effacer</button>
        <span id="polyCount" class="poly-count">0 point</span>
      </div>
    </div>

    <div class="edit-field">
      <label>Chameaux de ce camp</label>
      <div id="members" class="members"></div>
    </div>

    <div class="edit-actions">
      <button class="ghost-btn" id="cancelBtn" type="button">Annuler</button>
      <button class="primary grow" id="saveBtn" type="button">Enregistrer</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/geofence.js"></script>
  <script src="js/camps.js"></script>
  <script src="js/map.js"></script>
  <script src="js/camps-ui.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
